services:
  openfoundry:
    build: .
    ports:
      - "127.0.0.1:${OPENFOUNDRY_PORT:-8000}:8000"
    environment:
      OPENFOUNDRY_API_TOKEN: ${OPENFOUNDRY_API_TOKEN:?Set an operator token before starting Compose}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      MAX_MISSION_COST_USD: ${MAX_MISSION_COST_USD:-2.00}
      OPENFOUNDRY_SANDBOX_MODE: ${OPENFOUNDRY_SANDBOX_MODE:-auto}
      OPENFOUNDRY_MCP_SERVERS: ${OPENFOUNDRY_MCP_SERVERS:-[]}
      OPENFOUNDRY_MCP_COMMAND_ALLOWLIST: ${OPENFOUNDRY_MCP_COMMAND_ALLOWLIST:-[]}
    volumes:
      - foundry_data:/app/.openfoundry
      - workspaces:/app/workspaces
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  foundry_data:
  workspaces:
