[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfoundry"
version = "0.1.0"
description = "An autonomous AI company and self-healing software studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20,<1",
    "anyio>=4.6,<5",
    "pydantic>=2.10,<3",
    "litellm>=1.80,<2",
    "mcp>=1.20,<2",
    "httpx>=0.28,<1",
    "asgi-lifespan>=2.1,<3",
    "pillow>=11.3,<13",
    "beautifulsoup4>=4.13,<5",
    "markdownify>=1.2,<2",
    "pypdf>=6.1,<7",
    "websockets>=14,<17",
    "jsonschema>=4.23,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[project.optional-dependencies]
playwright = ["playwright>=1.55,<2"]
browser = ["browser-use>=0.11.13,<0.12"]
documents = ["docling>=2.140,<3"]
dev = ["mypy>=1.14,<2", "flake8>=7.1,<8", "types-jsonschema>=4.23", "types-beautifulsoup4>=4.12"]

[project.scripts]
openfoundry = "backend.app.main:run_cli"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
exclude = ["backend.tests*"]

[tool.setuptools.package-data]
"backend.app" = ["py.typed"]

[tool.setuptools.data-files]
"share/openfoundry/blueprints" = ["blueprints/*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["backend.app"]

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
follow_imports = "skip"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
